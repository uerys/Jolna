services:
  db:
    image: mysql:8.4
    container_name: recovry-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data:
